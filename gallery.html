<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — Randy Mattoka</title>
  <meta name="description" content="Browse digital illustration by Randy Mattoka: completed fan art, original works, and process sketches." />
  <link rel="canonical" href="https://randycomicart.com/gallery.html" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#09090b" />
  <meta property="og:title" content="Gallery — Randy Mattoka" />
  <meta property="og:description" content="A full archive of illustration, original worlds, and process work." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://randycomicart.com/gallery.html" />
  <meta property="og:image" content="https://randycomicart.com/images/fanart18.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://randycomicart.com/images/fanart18.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header" data-header>
    <a class="brand" href="index.html">
      <span class="brand-mark">Randy Mattoka</span>
      <span class="brand-sub">Studio</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span></span><span></span><span></span>
      <span class="visually-hidden">Menu</span>
    </button>
    <div class="nav-backdrop" data-nav-backdrop></div>
    <nav id="site-nav" class="site-nav" data-nav aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
      <a href="original.html">Original Works</a>
      <a href="software.html">Software</a>
      <a href="index.html#about">About</a>
    </nav>
  </header>

  <main id="main" class="page page-pad">
    <header class="page-hero page-hero-flush">
      <p class="kicker">Archive</p>
      <h1>Gallery</h1>
      <p>Everything in one room. Filter by collection, search by title or date, open any piece.</p>
    </header>

    <div class="gallery-toolbar">
      <div class="gallery-filters" role="group" aria-label="Filter artworks">
        <button type="button" class="active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="completed" aria-pressed="false">Completed / Fan Art</button>
        <button type="button" data-filter="original" aria-pressed="false">Original Works</button>
        <button type="button" data-filter="process" aria-pressed="false">Process / Sketches</button>
      </div>
      <div class="search-field" role="search">
        <label class="visually-hidden" for="site-search">Search gallery</label>
        <input id="site-search" type="search" placeholder="Search artwork…" autocomplete="off" />
        <div id="search-stats" class="search-stats" aria-live="polite"></div>
      </div>
    </div>

    <section id="gallery-grid" class="gallery-masonry" aria-live="polite" aria-label="Artwork grid"></section>
    <div id="load-more-wrap">
      <button id="load-more" type="button">Load more</button>
    </div>
  </main>

  <footer class="site-footer">
    <span>&copy; <span data-year>2026</span> Randy Mattoka</span>
    <a href="mailto:randy.mattoka@gmail.com">randy.mattoka@gmail.com</a>
  </footer>

  <div id="image-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="description-title" hidden>
    <div id="modal-content-area" class="modal-content">
      <div class="image-column">
        <div id="magnifier-container">
          <img id="modal-image" class="mag-image" src="" alt="" />
          <div id="magnifier-lens" class="mag-lens" aria-hidden="true"></div>
        </div>
      </div>
      <div class="description-column">
        <p class="kicker" id="description-project"></p>
        <h3 id="description-title"></h3>
        <p id="description-text"></p>
        <p id="description-meta"></p>
        <div class="modal-nav-panel">
          <button id="modal-prev-btn" class="modal-nav-button" type="button" aria-label="Previous image">&#10094;</button>
          <button id="modal-close-btn" class="modal-nav-button" type="button" aria-label="Close">&times;</button>
          <button id="modal-next-btn" class="modal-nav-button" type="button" aria-label="Next image">&#10095;</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/gallery.js"></script>
</body>
</html>
